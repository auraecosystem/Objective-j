<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-labelledby="title">
  <title id="title">Objective-J Logo</title>
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#00C3FF"/>
      <stop offset="1" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1220" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background rounded card -->
  <rect width="480" height="120" rx="14" fill="#08111a" />

  <!-- emblem -->
  <g transform="translate(28,20)" filter="url(#shadow)">
    <circle cx="36" cy="36" r="32" fill="url(#lg)" />
    <g transform="translate(36,36)">
      <path d="M-14 8 C -6 18, 10 18, 18 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      <text x="0" y="6" font-family="Inter,Segoe UI,Roboto,Arial" font-size="14" fill="#08111a" font-weight="800" text-anchor="middle">Obj</text>
    </g>
  </g>

  <!-- wordmark -->
  <text x="112" y="54" font-family="Inter,Segoe UI,Roboto,Arial" font-size="34" fill="#FFFFFF" font-weight="700">Objective-J</text>
  <text x="112" y="82" font-family="Inter,Segoe UI,Roboto,Arial" font-size="12" fill="#9fb7ff">Object-oriented web language that compiles to JavaScript</text>
</svg>
